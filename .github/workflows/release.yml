name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify tag matches extension version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require(\"./package.json\").version')"
      - name: Create installable archive
        run: cd dist && zip -r "../behaviour-tracer-${GITHUB_REF_NAME}.zip" .
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" "behaviour-tracer-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
