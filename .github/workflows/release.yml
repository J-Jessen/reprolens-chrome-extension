name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify tag matches extension version
        run: node scripts/check-release-tag.js "$GITHUB_REF_NAME"
      - name: Add public beta tester materials
        if: contains(github.ref_name, '-beta.')
        run: node scripts/package-beta-kit.js
      - name: Create installable archive
        run: cd dist && zip -r "../consolehawk-${GITHUB_REF_NAME}.zip" .
      - name: Publish beta pre-release
        if: contains(github.ref_name, '-beta.')
        run: gh release create "$GITHUB_REF_NAME" "consolehawk-${GITHUB_REF_NAME}.zip" --notes-file BETA_RELEASE_NOTES.md --prerelease --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish stable release
        if: contains(github.ref_name, '-beta.') == false
        run: gh release create "$GITHUB_REF_NAME" "consolehawk-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
