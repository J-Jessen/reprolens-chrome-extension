name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        corpus:
          - react-timer,native-success,fetch-failure,navigation,minified-map
          - minified-no-map,dom-text,dom-attribute,dom-add,dom-remove
          - timer-zero,timer-delayed,fetch-get,fetch-post,fetch-404
          - parallel-fetch,console-warning,sync-error,hash-navigation,history-replace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo-react/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Install demo build dependencies
        run: npm ci --prefix demo-react
      - name: Rebuild React fixture
        run: npm run build:react
      - name: Verify generated fixture is current
        run: git diff --exit-code -- demo-react/app.js demo-react/app.js.map
      - name: Run checks
        run: npm run check
      - name: Install automated browser
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(npx puppeteer browsers install chrome@139 --format '{{path}}')" >> "$GITHUB_ENV"
      - name: Run extension corpus
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          CORPUS_CASES: ${{ matrix.corpus }}
          HEADLESS: "false"
